    <!-- dataLayer helpers: automatic form instrumentation and consent mode scaffold -->
    <script>
      (function(){
        // Ensure dataLayer exists
        window.dataLayer = window.dataLayer || [];

        // Helper to push analytics events in a consistent shape
        window.analyticsPush = function(eventName, payload){
          try{
            var obj = Object.assign({event: eventName}, payload || {});
            window.dataLayer.push(obj);
            return obj;
          }catch(e){ console.error('analyticsPush error', e); }
        };

        // Auto-instrument forms that include `data-gtm-event` attribute
        function instrumentForms(){
          try{
            var forms = document.querySelectorAll('form[data-gtm-event]');
            Array.prototype.forEach.call(forms, function(form){
              if (form.__gtm_instrumented) return; // idempotent
              form.addEventListener('submit', function(e){
                try{
                  var ev = form.getAttribute('data-gtm-event') || 'form_submit';
                  var value = form.getAttribute('data-gtm-value');
                  var payload = {
                    formId: form.id || form.getAttribute('name') || null,
                    formAction: form.action || null
                  };
                  if (value) payload.value = parseFloat(value) || value;
                  window.analyticsPush(ev, payload);
                }catch(err){ /* don't block submit */ }
              }, {passive:true});
              form.__gtm_instrumented = true;
            });
          }catch(e){ /* ignore */ }
        }

        // Run on DOMContentLoaded and also in case forms are added later
        if (document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', instrumentForms);
        } else {
          instrumentForms();
        }

        // Expose a convenience method to re-scan forms dynamically
        window.gtmInstrumentForms = instrumentForms;

        // Consent Mode scaffold: set default and update consent state
        // Usage: window.setConsentDefaults(); window.updateConsent({ad_storage:'granted',analytics_storage:'granted'});
        window.setConsentDefaults = function(){
          try{
            window.dataLayer.push({
              'event': 'consent_default',
              'consent': { ad_storage: 'denied', analytics_storage: 'denied' }
            });
          }catch(e){ }
        };

        window.updateConsent = function(consentObj){
          try{
            // consentObj example: { ad_storage: 'granted', analytics_storage: 'granted' }
            window.dataLayer.push({ event: 'consent_update', consent: consentObj });
          }catch(e){ }
        };

        // Initialize default consent (safe default)
        window.setConsentDefaults();
      })();
    </script>

  <!-- Google tag (gtag.js) event - delayed navigation helper -->
  <script>
    // Helper function to delay opening a URL until a gtag event is sent.
    // Call it in response to an action that should navigate to a URL.
    function gtagSendEvent(url) {
      var callback = function () {
        if (typeof url === 'string') {
          window.location = url;
        }
      };
      gtag('event', 'attribution_captured', {
        'event_callback': callback,
        'event_timeout': 2000,
        // <event_parameters>
      });
      return false;
    }
  </script>

    <!-- Ensure third-party injected hidden iframes have an accessible title for scanners -->
    <script>
      (function(){
        try{
          // After third-party scripts run, some iframes are injected without titles.
          // Give any hidden iframe a descriptive title so automated scanners (pa11y)
          // and assistive tech can identify them.
          function labelHiddenIframes(){
            var iframes = document.querySelectorAll('iframe');
            for(var i=0;i<iframes.length;i++){
              var f = iframes[i];
              try{
                var style = window.getComputedStyle(f);
                var isHidden = (f.getAttribute('aria-hidden') === 'true') || f.hasAttribute('inert') || style.display === 'none' || style.visibility === 'hidden' || f.width == '0' || f.height == '0';
                if(isHidden){
                  if(!f.getAttribute('title')) f.setAttribute('title','auxiliary third-party frame');
                  if(!f.hasAttribute('aria-hidden')) f.setAttribute('aria-hidden','true');
                }
              }catch(e){}
            }
          }
          // Run once on DOMContentLoaded and again after a short delay to catch async injections
          if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', labelHiddenIframes);
          else labelHiddenIframes();
          setTimeout(labelHiddenIframes, 2500);
        }catch(e){}
      })();
    </script>
    <script>
      // Early apply of saved accessibility settings before React mounts to avoid flashes
      (function(){
        try {
          var raw = localStorage.getItem('a11ySettings');
          if (!raw) return;
          var s = JSON.parse(raw);
          var root = document.documentElement;
          // font scale
          var scale = Math.max(0.9, Math.min(1.8, parseFloat((s.fontScale||1)*1)));
          root.style.fontSize = (scale * 100) + '%';
          // boolean data attrs
          function setAttr(name, val){ if (val) root.setAttribute(name, 'true'); }
          setAttr('data-high-contrast', !!s.highContrast);
          setAttr('data-reduce-motion', !!s.reduceMotion);
          setAttr('data-highlight-links', !!s.highlightLinks);
          setAttr('data-readable-font', !!s.readableFont);
          setAttr('data-grayscale', !!s.grayscale);
          setAttr('data-invert', !!s.invert);
          if (s.lineHeight === 'relaxed') root.setAttribute('data-line-height', 'relaxed');
        } catch(e) { /* ignore */ }
      })();
    </script>
