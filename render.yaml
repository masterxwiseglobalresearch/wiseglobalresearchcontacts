services:
  - type: web
    name: wiseglobal-server
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: "/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.20.4
      - key: PORT
        value: 3002
      # Add your environment variables in Render Dashboard
      # SMTP_SERVER, SMTP_PORT, SMTP_USER, SMTP_PASS
      # EMAIL_FROM, INFO_EMAIL_TO, CAREER_EMAIL, SUPPORT_EMAIL_TO
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
      # DIGIO_API_URL, DIGIO_API_KEY

# Note: Set sensitive environment variables in the Render dashboard instead of committing them
# See server/.env.example for a complete list of required variables
