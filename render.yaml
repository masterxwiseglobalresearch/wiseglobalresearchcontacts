service: web
env: node
# Build root (frontend) then install server deps and start the server. Use npm install if no lockfile is committed.
# If you have a package-lock.json or yarn.lock, prefer `npm ci` for reproducible builds. Adjust as needed in Render settings.
buildCommand: "if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi && npm run build && npm --prefix server install --legacy-peer-deps"
# Start the server using the server package.json start script
startCommand: "npm --prefix server start"
envVars:
  - key: NODE_VERSION
    value: 18.20.4
# Health check path that Render will use to verify the service
healthCheckPath: "/health"

# When deploying, set environment variables in the Render dashboard instead of committing secrets
# See server/.env.example for a list of variables this service expects.
